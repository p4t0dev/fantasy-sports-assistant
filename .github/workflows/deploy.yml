# Deploy on every merge to main: tests, build, Firebase Hosting + Functions.
#
# One-time setup (see README, "Deploy per GitHub Actions"):
#   secret   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with
#                                      Firebase Admin, Cloud Functions Admin,
#                                      Service Account User, Secret Manager
#                                      Secret Accessor, Cloud Scheduler Admin
#   variable NEXT_PUBLIC_API_URL       base URL of the functions
#   variable FSA_ALLOWED_ORIGINS       as in functions/.env
#   variable FSA_SNAPSHOT_USERS        as in functions/.env
# Without the secret or the API URL it still runs tests, lint and build as a
# check, and ends green with a warning naming what is missing - a merge on
# an unconfigured repository is not a failure.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_API_URL: ${{ vars.NEXT_PUBLIC_API_URL != '' }}
      READY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.NEXT_PUBLIC_API_URL != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The functions run on Python 3.14 (gen2); firebase-tools reads the
          # runtime off the venv, so the venv has to be that version.
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Functions venv
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install -q -r functions/requirements.txt

      - name: Python tests
        run: functions/venv/bin/python -m unittest discover -s functions/tests

      - name: Frontend install, lint, build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          # Without the variable the build points at localhost: fine as a
          # check that it compiles, never deployed (READY below).
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Not configured - no deploy
        if: env.READY != 'true'
        run: |
          missing=""
          [ "$HAS_CREDENTIALS" = "true" ] || missing="$missing Secret FIREBASE_SERVICE_ACCOUNT,"
          [ "$HAS_API_URL" = "true" ] || missing="$missing Variable NEXT_PUBLIC_API_URL,"
          echo "::warning::Tests und Build ok, kein Deploy. Es fehlt:${missing%,} (Settings -> Secrets and variables -> Actions, siehe README)."
          echo "Kein Deploy - es fehlt:${missing%,}" >> "$GITHUB_STEP_SUMMARY"

      - name: Functions config
        if: env.READY == 'true'
        run: |
          printf 'FSA_ALLOWED_ORIGINS=%s\nFSA_SNAPSHOT_USERS=%s\n' \
            "${{ vars.FSA_ALLOWED_ORIGINS }}" "${{ vars.FSA_SNAPSHOT_USERS }}" > functions/.env

      - name: Deploy
        if: env.READY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14 deploy --non-interactive --force
          echo "Deployt: v$(node -p "require('./frontend/package.json').version") ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
